[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rail-punctuality-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over Belgian railway punctuality open data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cruzjover" }]
keywords = ["rag", "railway", "infrabel", "open-data", "fastapi"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1", 
    "pyarrow>=16",
    "pyyaml>=6.0", 
    "sqlglot>=25.0",   
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-pyyaml>=6.0",
]
gemini = ["google-genai"]

[tool.hatch.build.targets.wheel]
packages = ["src/rail_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL instance (docker compose up -d)",
]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.genai.*"]
ignore_missing_imports = true