      WHERE s.station_name = 'BRUSSEL-ZUID'
        AND f.date_key >= DATE '2025-03-01' AND f.date_key < DATE '2025-04-01'
      GROUP BY f.date_key
      ORDER BY f.date_key
    compare: {mode: ordered, accept_percent: true}

  - id: series_stop_events_monthly_2025
