# Golden set for the answering pipeline. Draft: review every case before it is trusted.
#
# Data cases carry a reference SQL whose result is the ground truth. Periods are bounded
# with literal ranges on f.date_key (the partition key) unless the case is tagged
# full_period. Rates are ratios between 0 and 1; accept_percent lets 95.2 match 0.952.
# Rankings state a minimum volume in the question, so the answer is well defined.
# Series references select only the measure; the period stays in GROUP BY and ORDER BY,
# so its representation (number, date, name) cannot cause a mismatch.
# Fact coverage: 2024-01-01 to 2026-09-07.

cases:
  # --- ratio -------------------------------------------------------------------------
  - id: ratio_gent_sint_pieters_2025_03
    question: What was the punctuality rate at Gent-Sint-Pieters in March 2025?
    tags: [ratio]
    expected_route: data
    reference_sql: >-
      SELECT SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_station s ON s.station_key = f.station_key
      WHERE s.station_name = 'GENT-SINT-PIETERS'
        AND f.date_key >= DATE '2025-03-01' AND f.date_key < DATE '2025-04-01'
    compare: {mode: scalar, accept_percent: true}

  - id: ratio_leuven_2025
    question: What was the punctuality rate at Leuven in 2025?
    tags: [ratio]
    expected_route: data
    reference_sql: >-
      SELECT SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_station s ON s.station_key = f.station_key
      WHERE s.station_name = 'LEUVEN'
        AND f.date_key >= DATE '2025-01-01' AND f.date_key < DATE '2026-01-01'
    compare: {mode: scalar, accept_percent: true}

  - id: ratio_relation_thal_2024
    question: What was the punctuality rate of relation THAL in 2024?
    tags: [ratio]
    expected_route: data
    reference_sql: >-
      SELECT SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_relation r ON r.relation_key = f.relation_key
      WHERE r.relation = 'THAL'
        AND f.date_key >= DATE '2024-01-01' AND f.date_key < DATE '2025-01-01'
    compare: {mode: scalar, accept_percent: true}

  - id: ratio_network_2025_07
    question: What was the overall punctuality rate across the network in July 2025?
    tags: [ratio]
    expected_route: data
    reference_sql: >-
      SELECT SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      WHERE f.date_key >= DATE '2025-07-01' AND f.date_key < DATE '2025-08-01'
    compare: {mode: scalar, accept_percent: true}

  - id: ratio_network_full_period
    question: What is the overall punctuality rate over the whole period covered by the data?
    tags: [ratio, full_period]
    expected_route: data
    reference_sql: >-
      SELECT SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
    compare: {mode: scalar, accept_percent: true}

  # --- ranking -----------------------------------------------------------------------
  - id: ranking_worst_stations_2025_03
    question: >-
      Which 5 stations had the lowest punctuality rate in March 2025, among stations
      with at least 10000 measured arrivals that month?
    tags: [ranking]
    expected_route: data
    reference_sql: >-
      SELECT s.station_name,
             SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_station s ON s.station_key = f.station_key
      WHERE f.date_key >= DATE '2025-03-01' AND f.date_key < DATE '2025-04-01'
      GROUP BY s.station_name
      HAVING SUM(f.measured_arrivals) >= 10000
      ORDER BY rate ASC, s.station_name
      LIMIT 5
    compare: {mode: ordered, top_k: 5, accept_percent: true}

  - id: ranking_best_stations_2025
    question: >-
      Which 3 stations had the highest punctuality rate in 2025, among stations with at
      least 100000 measured arrivals that year?
    tags: [ranking]
    expected_route: data
    reference_sql: >-
      SELECT s.station_name,
             SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_station s ON s.station_key = f.station_key
      WHERE f.date_key >= DATE '2025-01-01' AND f.date_key < DATE '2026-01-01'
      GROUP BY s.station_name
      HAVING SUM(f.measured_arrivals) >= 100000
      ORDER BY rate DESC, s.station_name
      LIMIT 3
    compare: {mode: ordered, top_k: 3, accept_percent: true}

  - id: ranking_worst_relations_2025
    question: >-
      Which 5 relations had the lowest punctuality rate in 2025, among relations with at
      least 20000 measured arrivals that year?
    tags: [ranking]
    expected_route: data
    reference_sql: >-
      SELECT r.relation,
             SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_relation r ON r.relation_key = f.relation_key
      WHERE f.date_key >= DATE '2025-01-01' AND f.date_key < DATE '2026-01-01'
      GROUP BY r.relation
      HAVING SUM(f.measured_arrivals) >= 20000
      ORDER BY rate ASC, r.relation
      LIMIT 5
    compare: {mode: ordered, top_k: 5, accept_percent: true}

  - id: ranking_worst_relation_full_period
    question: >-
      Over the whole period covered by the data, which relation has the lowest punctuality
      rate, among relations with at least 100000 measured arrivals?
    tags: [ranking, full_period]
    expected_route: data
    reference_sql: >-
      SELECT r.relation,
             SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      JOIN gold.dim_relation r ON r.relation_key = f.relation_key
      GROUP BY r.relation
      HAVING SUM(f.measured_arrivals) >= 100000
      ORDER BY rate ASC, r.relation
      LIMIT 1
    compare: {mode: ordered, top_k: 1, accept_percent: true}

  # --- time series -------------------------------------------------------------------
  - id: series_network_monthly_2025
    question: How did the network punctuality rate evolve month by month in 2025?
    tags: [time_series]
    expected_route: data
    reference_sql: >-
      SELECT SUM(f.punctual_arrivals)::float / NULLIF(SUM(f.measured_arrivals), 0) AS rate
      FROM gold.fact_stop_event f
      WHERE f.date_key >= DATE '2025-01-01' AND f.date_key < DATE '2026-01-01'
      GROUP BY EXTRACT(MONTH FROM f.date_key)
      ORDER BY EXTRACT(MONTH FROM f.date_key)
    compare: {mode: ordered, accept_percent: true}

  - id: series_brussel_zuid_daily_2025_03
    question: What was the daily punctuality rate at Brussel-Zuid during March 2025?
    tags: [time_series]
