      FROM gold.fact_stop_event f
      WHERE f.date_key >= DATE '2025-01-01' AND f.date_key < DATE '2026-01-01'
      GROUP BY EXTRACT(MONTH FROM f.date_key)
      ORDER BY EXTRACT(MONTH FROM f.date_key)
    compare: {mode: ordered}

  - id: series_antwerpen_centraal_monthly_2024
    question: How did the punctuality rate at Antwerpen-Centraal evolve month by month in 2024?
