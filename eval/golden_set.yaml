      FROM gold.fact_stop_event f
      JOIN gold.dim_station s ON s.station_key = f.station_key
      WHERE s.station_name = 'ANTWERPEN-CENTRAAL'
        AND f.date_key >= DATE '2024-01-01' AND f.date_key < DATE '2025-01-01'
      GROUP BY EXTRACT(MONTH FROM f.date_key)
      ORDER BY EXTRACT(MONTH FROM f.date_key)
    compare: {mode: ordered, accept_percent: true}

