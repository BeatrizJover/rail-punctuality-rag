name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rail_rag
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rail_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rail_rag -d rail_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://rail_rag:ci-only-password@localhost:5432/rail_rag_test
      # An unreachable database must fail the job, not skip the integration tests.
      TEST_DATABASE_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,gemini]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type-check
        run: mypy --strict

      - name: Test
        run: pytest
