# Retrieval configuration for the RAG layer.

sql:
  # Allow-list, not a deny-list: a new table is invisible until it is named here.
  # Staging and ops are absent by design - stg_fact_stop_event is an unvalidated
  # landing zone, and answering from it would report numbers the fact table rejected.
  allowed_tables:
    - gold.dim_date
    - gold.dim_station
    - gold.dim_relation
    - gold.fact_stop_event
    - gold.agg_station_day
    - gold.agg_relation_day

  # Caps the outermost SELECT; a larger limit written by the model is tightened.
  max_rows: 200

  # Server-side, so a runaway query dies without the client having to cancel it.
  statement_timeout_ms: 30000

  # Reachable from SQL without any table privilege, hence blocked by name.
  blocked_functions:
    - pg_sleep
    - pg_read_file
    - pg_read_binary_file
    - pg_ls_dir
    - pg_stat_file
    - lo_import
    - lo_export
    - dblink
    - dblink_exec
    - query_to_xml
    - pg_terminate_backend
    - pg_cancel_backend
    - set_config
    - pg_reload_conf

# Nothing here rewrites a query; only max_plan_cost can reject one.
sql_checks:
  # EXPLAIN (planning only) before execution; records cost, rows and partitions scanned.
  explain: true
  # Provisional (E2-8): a one-year fact scan by hour plans ~0.67M, the full period ~1.81M.
  max_plan_cost: 1000000
