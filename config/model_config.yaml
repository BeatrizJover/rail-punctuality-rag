# LLM and embedding model configuration for the RAG layer.
# Secrets never live here: the API key is read from RAIL_RAG_LLM_API_KEY.
# Set provider to "fake" to run the whole stack offline, with no key.

provider: gemini

generation:
  model: gemini-2.0-flash
  # Deterministic by design: the same question must produce the same SQL.
  temperature: 0.0
  max_output_tokens: 1024
  timeout_s: 60

embedding:
  model: text-embedding-004
  # Pinned into the rag schema's vector(n) column; changing it needs a re-embed.
  dimension: 768
  batch_size: 32
  timeout_s: 60

# Free-tier quotas are per-minute, so a burst of embeddings will hit 429.
max_retries: 3
retry_backoff_s: 2.0
